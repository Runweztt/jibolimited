<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" fill="none">
  <!-- Currency symbols square -->
  <g id="currency-square">
    <rect x="10" y="40" width="280" height="280" rx="35" fill="#002B5C"/>
    
    <!-- Currency symbols in gold -->
    <g fill="#D4AF37" font-family="Arial, sans-serif" font-weight="bold">
      <!-- Pound (£) -->
      <text x="50" y="140" font-size="90">£</text>
      <!-- Dollar ($) -->
      <text x="160" y="140" font-size="90">$</text>
      <!-- Yen (¥) -->
      <text x="50" y="270" font-size="90">¥</text>
      <!-- Naira (₦) -->
      <text x="160" y="270" font-size="90">₦</text>
    </g>
  </g>
  
  <!-- JIBO text -->
  <g id="jibo-text" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900">
    <text x="320" y="180" font-size="120" letter-spacing="-2">JIBO</text>
  </g>
  
  <!-- CURRENCY text -->
  <g id="currency-text" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">
    <text x="320" y="260" font-size="65" letter-spacing="8">CURRENCY</text>
  </g>
</svg>
